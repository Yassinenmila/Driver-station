services:

  streamlit:
    build: .
    container_name: driver-station-streamlit
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: streamlit run app/app.py --server.address=0.0.0.0

  jupyter:
    build: .
    container_name: driver-station-jupiter
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root